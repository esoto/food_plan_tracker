# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Disable bracket-spacing cop — it ping-pongs between human style and Rails'
# autogenerated `db/schema.rb` / `db/{cache,queue,cable}_schema.rb` (which
# Rails regenerates on every `db:schema:dump` without spaces). Rather than
# fight Rails on every migration, allow either style across the project.
Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false
