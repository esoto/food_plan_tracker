es:
  date:
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    abbr_month_names:
      - ~
      - ene
      - feb
      - mar
      - abr
      - may
      - jun
      - jul
      - ago
      - sep
      - oct
      - nov
      - dic
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    formats:
      default: "%d-%m-%Y"
      long: "%-d de %B de %Y"
      short: "%-d %b"
    month_names:
      - ~
      - enero
      - febrero
      - marzo
      - abril
      - mayo
      - junio
      - julio
      - agosto
      - septiembre
      - octubre
      - noviembre
      - diciembre
    order: [day, month, year]

  time:
    am: am
    pm: pm
    formats:
      default: "%-d de %B de %Y a las %H:%M"
      long: "%-d de %B de %Y a las %H:%M"
      short: "%d %b %H:%M"

  support:
    array:
      last_word_connector: " y "
      two_words_connector: " y "
      words_connector: ", "

  number:
    format:
      delimiter: "."
      precision: 2
      separator: ","
