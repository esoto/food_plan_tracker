# Kamal deployment config for the Food Plan Tracker.
# Edit the VPS host, registry, and ssl host before `bin/kamal setup`.

service: food_plan_tracker

image: esoto/food_plan_tracker

servers:
  web:
    - REPLACE_WITH_VPS_IP

proxy:
  ssl: true
  host: REPLACE_WITH_HOSTNAME    # e.g. food.yourdomain.com
  app_port: 3000

registry:
  # Using GitHub Container Registry by default. Swap for Docker Hub or a
  # private registry as needed.
  server: ghcr.io
  username: esoto
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    SOLID_QUEUE_IN_PUMA: "true"
    TZ: America/Costa_Rica
  secret:
    - RAILS_MASTER_KEY
    - ESTEBAN_EMAIL
    - ESTEBAN_PASSWORD

# SQLite database + Active Storage survive deploys via a named volume.
volumes:
  - "food_plan_tracker_storage:/rails/storage"

# Bridge digested assets across versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  seed:    app exec --reuse "bin/rails db:seed"
