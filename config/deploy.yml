# Kamal deployment config for the Food Plan Tracker.
# Hetzner VPS, deployed alongside blog / salary-calc / portfolio / expense-tracker.
# Container registry: ghcr.io. SSL: Let's Encrypt via shared kamal-proxy.

service: food_plan_tracker

image: esoto/food_plan_tracker

servers:
  web:
    - 178.104.88.183

ssh:
  user: deploy

proxy:
  ssl: true
  host: food.estebansoto.dev
  app_port: 3000

registry:
  # Using GitHub Container Registry by default. Swap for Docker Hub or a
  # private registry as needed.
  server: ghcr.io
  username: esoto
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    SOLID_QUEUE_IN_PUMA: "true"
    TZ: America/Costa_Rica
    # Postgres connection — shared `personal-blog-db` container (Kamal network).
    POSTGRES_USER: food_plan_tracker
    POSTGRES_HOST: personal-blog-db
    POSTGRES_PORT: "5432"
    # Primary DB pool per process. Same math as expense_tracker (PER-494):
    # Puma + SQ supervisor + dispatcher + workers ≈ 6 procs × 10 = 60 conns,
    # safely under the shared host's max_connections=100.
    DB_POOL: "10"
    # Web threads + queue/cache/cable pool size. SQ critical worker needs
    # 5 threads + supervisor + dispatcher = 7; expense_tracker hit
    # "configured to use 7 threads but pool is 6" with 6 here.
    RAILS_MAX_THREADS: "8"
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - ADMIN_EMAIL
    - ADMIN_PASSWORD

# Active Storage uploads survive deploys via a named volume. SQLite files
# previously lived here too — no longer needed since the move to Postgres.
volumes:
  - "food_plan_tracker_storage:/rails/storage"

# Per-app daily backups: own container, own volume, own retention.
# Reads the 4 food_plan_tracker DBs from the shared personal-blog-db
# Postgres host using the read-only `backup` role (see Hetzner VPS note).
accessories:
  backups:
    # Pin to the postgres major matching the host DB (personal-blog-db is
    # postgres:17). Avoids :latest-driven supply-chain drift on accessory
    # restart.
    image: prodrigestivill/postgres-backup-local:17
    host: 178.104.88.183
    volumes:
      - "food_plan_tracker-backups:/backups"
    env:
      clear:
        POSTGRES_HOST: personal-blog-db
        POSTGRES_DB: food_plan_tracker_production,food_plan_tracker_production_cache,food_plan_tracker_production_queue,food_plan_tracker_production_cable
        POSTGRES_USER: backup
        SCHEDULE: "@daily"
        BACKUP_KEEP_DAYS: "30"
        BACKUP_KEEP_WEEKS: "4"
        BACKUP_KEEP_MONTHS: "6"
        # Exposes /health on 8080 so `kamal accessory details backups`
        # reflects whether the cron loop is actually alive, not just that
        # the container is running.
        HEALTHCHECK_PORT: "8080"
      secret:
        - POSTGRES_PASSWORD:BACKUP_POSTGRES_PASSWORD

# Bridge digested assets across versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

aliases:
  console:        app exec --interactive --reuse "bin/rails console"
  shell:          app exec --interactive --reuse "bash"
  logs:           app logs -f
  seed:           app exec --reuse "bin/rails db:seed"
  api-token-list: app exec --reuse "bin/rails api_tokens:list"
