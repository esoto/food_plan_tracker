# PostgreSQL config. Connects to the shared `personal-blog-db` container
# on the Hetzner box (see Hetzner VPS Obsidian note). Each app on that
# server has its own user + 4 databases (primary + queue + cache + cable
# for the Solid stack).
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "" } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
  # Disable GSS encryption to prevent segfault in forked processes on macOS
  # (libpq probes Kerberos via XPC, crashes after fork because XPC ports
  # aren't inherited).
  gssencmode: disable
  checkout_timeout: 5
  reaping_frequency: 10
  idle_timeout: 300
  connect_timeout: 2

development:
  <<: *default
  database: food_plan_tracker_development

test:
  <<: *default
  database: food_plan_tracker_test<%= ENV["TEST_ENV_NUMBER"] %>
  min_messages: WARNING
  template: template0
  pool: 10

production:
  primary:
    <<: *default
    database: food_plan_tracker_production
    username: <%= ENV.fetch("POSTGRES_USER") { "food_plan_tracker" } %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    pool: <%= ENV.fetch("DB_POOL", 10) %>
    statement_timeout: 30000
    lock_timeout: 10000
  cache:
    <<: *default
    database: food_plan_tracker_production_cache
    username: <%= ENV.fetch("POSTGRES_USER") { "food_plan_tracker" } %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: food_plan_tracker_production_queue
    username: <%= ENV.fetch("POSTGRES_USER") { "food_plan_tracker" } %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: food_plan_tracker_production_cable
    username: <%= ENV.fetch("POSTGRES_USER") { "food_plan_tracker" } %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    migrations_paths: db/cable_migrate
